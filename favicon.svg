<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CHAI & CO. Warm Artisanal Terracotta & Honey Amber Gradient -->
    <linearGradient id="chaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="45%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#88360d" />
    </linearGradient>
    <!-- Subtle Golden Rim Glow -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Chai & Co. Icon Squircle Background matching header logo -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#chaiBg)" filter="url(#softGlow)" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="url(#goldRim)" stroke-width="1.5" />

  <!-- Steaming Chai Cup Mark matching .brand-logo .logo-icon -->
  <g transform="translate(13.5, 13.5) scale(0.0722)" fill="#ffffff">
    <!-- 3 Rising Steam Wisps -->
    <path d="M96 0c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32s32-14.3 32-32V32c0-17.7-14.3-32-32-32zm96 0c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32s32-14.3 32-32V32c0-17.7-14.3-32-32-32zm96 0c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32s32-14.3 32-32V32c0-17.7-14.3-32-32-32z"/>
    <!-- Teacup Body and Handle -->
    <path d="M400 192H32c-17.7 0-32 14.3-32 32v192c0 53 43 96 96 96h192c53 0 96-43 96-96h16c35.3 0 64-28.7 64-64v-96c0-35.3-28.7-64-64-64h-16zm16 128h-16v-64h16c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16z"/>
  </g>
</svg>
